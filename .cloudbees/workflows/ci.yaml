apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: delivery-control-ci

on:
  push:
    branches:
      - '**'

jobs:
  build-test-security:
    steps:
      - name: Checkout source code
        uses: cloudbees-io/checkout@v1

      - name: Install dependencies
        uses: docker://node:20-alpine
        shell: sh
        run: |
          npm install

      - name: Run dependency security audit
        uses: docker://node:20-alpine
        shell: sh
        run: |
          npm audit --audit-level=high

      - name: Run application tests
        uses: docker://node:20-alpine
        shell: sh
        run: |
          npm test
      
      - name: Create deployable artifact
        uses: docker://node:20-alpine
        shell: sh
        run: |
          mkdir -p dist
          tar -czf dist/delivery-control-demo-1.0.0.tar.gz server.js package.json package-lock.json test.js
          echo "Artifact created: dist/delivery-control-demo-1.0.0.tar.gz"

      - name: Simulate deployment to staging
        uses: docker://node:20-alpine
        shell: sh
        run: |
          echo "Deploying artifact dist/delivery-control-demo-1.0.0.tar.gz to staging..."
          echo "Deployment completed successfully"
